name: contribution card

on:
  schedule:
    # 07:10 UTC, a little after midnight Central, so the card turns over
    # with the day it reports.
    - cron: "10 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/streak_card.py
      - .github/workflows/streak-card.yml

permissions:
  contents: write

concurrency:
  group: contribution-card
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render the card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/streak_card.py --user oneKn8 --out assets

      - name: Point the README at today's render
        run: |
          today=$(date -u +%Y%m%d)
          # '#' as the delimiter: the pattern contains both '/' and '|'.
          sed -i -E "s#(assets/streak-(dark|light)\.svg\?v=)[0-9]{8}#\1${today}#g" README.md
          grep -q "v=${today}" README.md

      - name: Commit if anything moved
        run: |
          # Committed by the bot on purpose. If these commits carried the
          # profile owner's email they would count as contributions, and the
          # card would be keeping alive the streak it reports.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "card unchanged"
            exit 0
          fi
          git commit -m "Update contribution card"
          git push
